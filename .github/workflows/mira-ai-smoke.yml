name: Mira Reflection AI Integration Smoke Test
on:
  push:
    branches: [mira-api-smoke-20261125]
  workflow_dispatch:
jobs:
  test-mira-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run synthetic public API checks
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, sys, time
          API = "https://mira-reflection-beta.zhanglu77.workers.dev"
          ORIGIN = "https://headless-vqybxjmjvgx-zhanglu77-1409.wix-site-host.com"
          failures=[]
          def send(path, data=None, origin=ORIGIN):
              payload=json.dumps(data).encode() if data is not None else None
              headers={"Origin":origin,"Content-Type":"application/json"}
              req=urllib.request.Request(API+path, data=payload, headers=headers,method="POST" if data is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=35) as r:
                      return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return e.code,json.loads(e.read().decode())
                  except Exception: return e.code,{}
          def expect(ok,label,more=""):
              print(("PASS" if ok else "FAIL"), label,more,flush=True)
              if not ok: failures.append(label)
          try:
              status,doc=send("/health")
              expect(status==200 and doc.get("knowledge_chapters")==9,"health and nine lesson sources", f"status={status} model={doc.get('model')}")
              status,doc=send("/chat",{"message":"I feel overwhelmed","adult":True,"consent":True},origin="https://example.invalid")
              expect(status==403,"blocked cross-origin POST",f"status={status}")
              status,doc=send("/chat",{"message":"I feel overwhelmed","adult":True,"consent":False})
              expect(status==403,"requires consent",f"status={status}")
              status,doc=send("/chat",{"message":"I want to kill myself","adult":True,"consent":True})
              expect(status==200 and doc.get("safety")=="crisis" and "988" in doc.get("reply",""),"crisis short circuit",f"status={status}")
              for label,text in [
                ("family reflection","I feel angry when family plans are made without telling me. What is a small next step?"),
                ("hearing boundary","What does Hearing Boundary mean when someone judges my motives?")
              ]:
                  status,doc=send("/chat",{"message":text,"adult":True,"consent":True,"history":[]})
                  reply=doc.get("reply","")
                  sources=doc.get("sources",[])
                  expect(status==200 and doc.get("mode")=="AI+retrieval" and len(reply)>20 and len(sources)>=1,label,f"status={status} source_ids={[s.get('id') for s in sources]} answer_length={len(reply)}")
                  if status==200:
                      print("SYNTHETIC_RESPONSE",label,reply[:600].replace("\n"," "),flush=True)
                  else: print("ERROR",str(doc)[:500],flush=True)
                  time.sleep(2)
          except Exception as exc:
              failures.append(str(exc))
              print("EXCEPTION",repr(exc),flush=True)
          print("RESULT", "PASS" if not failures else "FAIL",failures,flush=True)
          if failures: sys.exit(1)
          PY
